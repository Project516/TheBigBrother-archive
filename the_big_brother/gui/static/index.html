<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BIG BROTHER v2.1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --bg-color: #020202;
            --text-color: #00ff41;
            --accent-color: #00ff41;
            --secondary-bg: #0a0a0a;
            --border-color: #003300;
            --grid-color: rgba(0, 255, 65, 0.1);
            --success: #00ff41;
            --error: #ea0000;
            --warning: #ffcc00;
        }

        /* Glitch Animation */
        @keyframes glitch {

            2%,
            64% {
                transform: translate(2px, 0) skew(0deg);
            }

            4%,
            60% {
                transform: translate(-2px, 0) skew(0deg);
            }

            62% {
                transform: translate(0, 0) skew(5deg);
            }
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            text-transform: uppercase;
        }

        /* Matrix/Grid Background */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            z-index: 0;
            pointer-events: none;
        }

        header {
            width: 100%;
            padding: 40px 20px;
            text-align: center;
            position: relative;
            z-index: 10;
            border-bottom: 2px solid var(--accent-color);
            background: radial-gradient(circle at center, rgba(0, 50, 0, 0.5), #000);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.2);
        }

        h1 {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 4rem;
            letter-spacing: 10px;
            text-shadow: 0 0 20px var(--accent-color);
            animation: glitch 1s linear infinite;
        }

        .subtitle {
            font-size: 1rem;
            color: #fff;
            margin-top: 10px;
            text-shadow: 0 0 5px #fff;
            letter-spacing: 2px;
        }

        .dev-tag {
            color: var(--accent-color);
            font-weight: bold;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin-top: 50px;
            z-index: 10;
            position: relative;
        }

        /* HUD Panels */
        .hud-panel {
            background: rgba(0, 20, 0, 0.8);
            border: 1px solid var(--accent-color);
            box-shadow: 0 0 15px var(--accent-color);
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }

        /* Images */
        .images-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            min-height: 200px;
            perspective: 1000px;
        }

        .image-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            transform-style: preserve-3d;
            transition: 0.5s;
        }

        .image-wrapper:hover {
            transform: scale(1.1) rotateY(10deg);
            z-index: 100;
        }

        .captured-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 2px solid var(--accent-color);
            background: #000;
            box-shadow: 0 0 20px var(--accent-color);
        }

        .dl-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--accent-color);
            color: #000;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 5px;
            font-weight: bold;
        }

        /* Input Area */
        .search-area {
            display: flex;
            justify-content: center;
            gap: 0;
            margin-bottom: 20px;
        }

        input {
            width: 50%;
            padding: 20px;
            background: rgba(0, 20, 0, 0.5);
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.5rem;
            outline: none;
            box-shadow: 0 0 10px var(--accent-color) inset;
        }

        button.glitch-btn {
            padding: 0 40px;
            background: #000;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            border-left: none;
        }

        button.glitch-btn:hover {
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 30px var(--accent-color);
        }

        /* Secondary Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        .ctrl-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Share Tech Mono';
            transition: 0.2s;
            height: 48px;
        }

        .ctrl-btn.stop {
            border-color: var(--error);
            color: var(--error);
        }

        .ctrl-btn.stop:hover {
            background: var(--error);
            color: #000;
        }

        .ctrl-btn.download {
            border-color: var(--warning);
            color: var(--warning);
        }

        .ctrl-btn.download:hover {
            background: var(--warning);
            color: #000;
        }

        /* Dorks Section */
        .dork-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid var(--accent-color);
            padding: 5px;
        }

        .dork-select {
            background: #000;
            color: var(--accent-color);
            border: none;
            padding: 10px;
            font-family: 'Share Tech Mono';
            font-size: 1rem;
            outline: none;
            width: 200px;
            height: 36px;
        }

        .dork-btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            height: 36px;
            display: flex;
            align-items: center;
        }

        .dork-btn:hover {
            background: #fff;
        }


        .status {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 10px currentColor;
        }

        /* Grid Results */
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .result-card {
            background: rgba(0, 10, 0, 0.8);
            border: 1px solid var(--border-color);
            padding: 20px;
            transition: 0.3s;
            position: relative;
        }

        .result-card:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            transform: scale(1.02);
            z-index: 5;
            background: #000;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .site-name {
            font-weight: bold;
            color: #fff;
            font-size: 1.2rem;
        }

        .link {
            color: var(--accent-color);
            text-decoration: none;
            word-break: break-all;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 10px;
        }

        .meta-info {
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
        }

        .status-badge {
            padding: 2px 8px;
            font-size: 0.8rem;
            font-weight: bold;
            background: #111;
            border: 1px solid #333;
        }

        .status-badge.verified {
            border-color: var(--success);
            color: var(--success);
            box-shadow: 0 0 5px var(--success);
        }

        .status-badge.false {
            border-color: var(--error);
            color: var(--error);
        }

        .status-badge.check {
            border-color: var(--warning);
            color: var(--warning);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: 0.5;
            }
        }

        /* Deep Search Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 200;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #001100;
            border: 2px solid var(--accent-color);
            padding: 20px;
            width: 80%;
            max-width: 1000px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 0 50px var(--accent-color);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-color);
        }

        .deep-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .engine-col {
            border: 1px solid #333;
            padding: 10px;
        }

        .engine-title {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--accent-color);
        }

        .deep-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            margin: 5px;
            border: 1px solid #444;
            cursor: pointer;
            transition: 0.2s;
        }

        .deep-img:hover {
            transform: scale(1.5);
            border-color: var(--accent-color);
            z-index: 10;
            position: relative;
        }

        /* Deep Search FX */
        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            z-index: 50;
            background:
                linear-gradient(rgba(0, 255, 65, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.2) 1px, transparent 1px);
            background-size: 20px 20px;
            animation: grid-scroll 2s linear infinite;
        }

        @keyframes grid-scroll {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 0 100%;
            }
        }

        .reticle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            border: 2px solid var(--accent-color);
            display: none;
            z-index: 51;
            box-shadow: 0 0 10px var(--accent-color), inset 0 0 20px var(--accent-color);
        }

        .reticle::before,
        .reticle::after {
            content: '';
            position: absolute;
            background: var(--accent-color);
        }

        /* Crosshairs */
        .reticle::before {
            top: 50%;
            left: -10px;
            width: 20px;
            height: 2px;
            box-shadow: calc(100% + 180px) 0 0 var(--accent-color);
        }

        .reticle::after {
            top: -10px;
            left: 50%;
            width: 2px;
            height: 20px;
            box-shadow: 0 calc(100% + 180px) 0 var(--accent-color);
        }

        .scanning-text {
            position: absolute;
            bottom: 5px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.7rem;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            z-index: 52;
            font-weight: bold;
        }

        /* Matrix Rain in Modal */
        .matrix-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.1;
            font-family: monospace;
            overflow: hidden;
            z-index: -1;
        }

        .btn-deep {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            color: var(--accent-color);
            border: none;
            padding: 5px;
            cursor: pointer;
            opacity: 0;
            transition: 0.3s;
            font-family: 'Share Tech Mono';
            letter-spacing: 2px;
            border-bottom: 2px solid var(--accent-color);
        }

        .image-wrapper:hover .btn-deep {
            opacity: 1;
        }

        /* Target Analysis in Modal */
        .target-analysis {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 20px;
        }

        .target-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            border: 2px solid var(--accent-color);
            background: #000;
            overflow: hidden;
        }

        .target-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
        }

        /* FX in Modal */
        .target-scan {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 255, 65, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.4) 1px, transparent 1px);
            background-size: 20px 20px;
            animation: grid-scroll 1s linear infinite;
            z-index: 10;
            pointer-events: none;
        }

        .target-reticle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 15px var(--accent-color);
            z-index: 11;
        }

        .target-reticle::before {
            content: '';
            position: absolute;
            top: 50%;
            left: -10%;
            width: 120%;
            height: 2px;
            background: var(--accent-color);
        }

        .target-reticle::after {
            content: '';
            position: absolute;
            left: 50%;
            top: -10%;
            height: 120%;
            width: 2px;
            background: var(--accent-color);
        }

        .btn-deep:hover {
            background: var(--accent-color);
            color: #000;
        }
    </style>
</head>

<body>
    <header>
        <h1>THE BIG BROTHER</h1>
        <div class="subtitle">QUANTUM OSINT ENGINE // V2.1</div>
        <div class="subtitle">SYSTEM ARCHITECT: <span class="dev-tag">CHADI0X</span></div>
    </header>

    <div class="container">

        <div id="images-container" class="images-container"></div>

        <div class="hud-panel">
            <div class="search-area">
                <input type="text" id="username" placeholder="ENTER TARGET IDENTIFIER..."
                    onkeydown="if(event.key==='Enter') startScan()">
                <button onclick="startScan()" id="btn-scan" class="glitch-btn">INITIATE</button>
            </div>

            <div class="controls">
                <button id="btn-stop" class="ctrl-btn stop" onclick="stopScan()" disabled>[X] ABORT SEQUENCE</button>
                <button id="btn-download" class="ctrl-btn download" onclick="downloadReport()" disabled>[V] EXPORT
                    DATA</button>

                <div class="dork-wrapper">
                    <select id="dork-select" class="dork-select">
                        <option value="linkedin">LINKEDIN</option>
                        <option value="instagram">INSTAGRAM</option>
                        <option value="twitter">TWITTER</option>
                        <option value="facebook">FACEBOOK</option>
                        <option value="tiktok">TIKTOK</option>
                        <option value="pinterest">PINTEREST</option>
                        <option value="github">GITHUB</option>
                        <option value="gitlab">GITLAB</option>
                        <option value="stackoverflow">STACKOVERFLOW</option>
                        <option value="pastebin">PASTEBIN</option>
                        <option value="reddit">REDDIT</option>
                        <option value="pdf">FILETYPE: PDF</option>
                        <option value="doc">FILETYPE: DOC</option>
                        <option value="txt">FILETYPE: TXT</option>
                        <option value="intext">INTEXT SCAN</option>
                        <option value="intitle">INTITLE SCAN</option>
                        <option value="inurl">INURL SCAN</option>
                        <option value="password">BREACH CHECK</option>
                        <option value="email">EMAIL CHECK</option>
                        <option value="phone">PHONE CHECK</option>
                    </select>
                    <button class="dork-btn" onclick="executeDork()">DEPLOY DORK ></button>
                </div>
            </div>

            <div id="status" class="status" style="color: #fff;">SYSTEM STANDBY.</div>
        </div>

        <div id="results" class="results"></div>

        <!-- Deep Search Modal -->
        <div id="deepModal" class="modal">
            <div class="modal-content">
                <span class="close-btn" onclick="closeDeepModal()">&times;</span>
                <h2>DEEP VISUAL INTEL</h2>

                <div class="target-analysis">
                    <div class="target-wrapper">
                        <div class="target-scan"></div>
                        <div class="target-reticle"></div>
                        <img id="deep-target-img" src="" style="width:100%; height:100%;">
                    </div>
                    <div
                        style="color:var(--accent-color); font-size:0.8rem; margin-top:5px; animation:blink 1s infinite">
                        SCANNING TARGET...</div>
                </div>

                <div id="deep-status" class="status-bar" style="margin-bottom: 20px;">READY</div>
                <div class="deep-grid">
                    <div class="engine-col">
                        <div class="engine-title">GOOGLE IMAGES</div>
                        <div id="google-results"></div>
                    </div>
                    <div class="engine-col">
                        <div class="engine-title">BING VISUAL</div>
                        <div id="bing-results"></div>
                    </div>
                    <div class="engine-col">
                        <div class="engine-title">YANDEX VISION</div>
                        <div id="yandex-results"></div>
                    </div>
                    <div class="engine-col">
                        <div class="engine-title">TINEYE TRACKER</div>
                        <div id="tineye-results"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let jobId = null;
        let pollInterval = null;
        let currentUsername = "";

        async function startScan() {
            const username = document.getElementById('username').value.trim();
            if (!username) return;
            currentUsername = username;

            // Reset UI
            document.getElementById('results').innerHTML = '';
            document.getElementById('images-container').innerHTML = '<div style="color:var(--accent-color); padding:20px; text-align:center; width:100%;">[ SEARCHING FOR BIOMETRIC DATA... ]</div>';
            document.getElementById('status').innerHTML = 'INITIALIZING NEURAL LINK...';
            document.getElementById('status').style.color = '#fff';

            document.getElementById('btn-scan').disabled = true;
            document.getElementById('btn-stop').disabled = false;
            document.getElementById('btn-download').disabled = true;
            document.getElementById('username').disabled = true;

            try {
                const res = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const data = await res.json();
                jobId = data.job_id;

                if (pollInterval) clearInterval(pollInterval);
                pollInterval = setInterval(poll, 1500);
            } catch (e) {
                console.error(e);
                alert("SYSTEM FAILURE: CONNECTION REFUSED");
                resetState();
            }
        }

        async function stopScan() {
            if (!jobId) return;
            try {
                await fetch(`/api/stop/${jobId}`, { method: 'POST' });
                document.getElementById('status').innerText = "ABORTING SEQUENCE...";
                document.getElementById('status').style.color = 'var(--error)';
            } catch (e) { console.error(e); }
        }

        function downloadReport() {
            if (!jobId) return;
            window.location.href = `/api/download/${jobId}`;
        }

        function executeDork() {
            const u = document.getElementById('username').value.trim() || currentUsername;
            if (!u) return alert("ENTER TARGET IDENTIFIER FIRST");

            const type = document.getElementById('dork-select').value;
            let query = "";

            switch (type) {
                case 'linkedin': query = `site:linkedin.com "${u}"`; break;
                case 'instagram': query = `site:instagram.com "${u}"`; break;
                case 'twitter': query = `site:twitter.com "${u}"`; break;
                case 'facebook': query = `site:facebook.com "${u}"`; break;
                case 'tiktok': query = `site:tiktok.com "${u}"`; break;
                case 'pinterest': query = `site:pinterest.com "${u}"`; break;
                case 'github': query = `site:github.com "${u}"`; break;
                case 'gitlab': query = `site:gitlab.com "${u}"`; break;
                case 'stackoverflow': query = `site:stackoverflow.com "${u}"`; break;
                case 'pastebin': query = `site:pastebin.com "${u}"`; break;
                case 'reddit': query = `site:reddit.com "${u}"`; break;
                case 'pdf': query = `filetype:pdf "${u}"`; break;
                case 'doc': query = `filetype:doc "${u}"`; break;
                case 'txt': query = `filetype:txt "${u}"`; break;
                case 'intext': query = `intext:"${u}"`; break;
                case 'intitle': query = `intitle:"${u}"`; break;
                case 'inurl': query = `inurl:"${u}"`; break;
                case 'password': query = `"${u}" "password"`; break;
                case 'email': query = `"${u}" email`; break;
                case 'phone': query = `"${u}" phone`; break;
            }

            if (query) window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
        }

        function downloadImage(url) {
            const a = document.createElement('a');
            a.href = url;
            a.download = `target_${currentUsername}.jpg`;
            a.target = '_blank';
            a.click();
        }

        async function poll() {
            if (!jobId) return;

            try {
                const res = await fetch(`/api/results/${jobId}`);
                const data = await res.json();

                renderImages(data.images || []);
                renderResults(data.results);

                let statusText = "";
                let color = "#fff";

                if (data.status === 'running') { statusText = "SCANNING GLOBAL NETWORKS..."; color = "var(--accent-color)"; }
                else if (data.status === 'validating') { statusText = "VERIFYING TARGET VULNERABILITIES [HEADLESS]..."; color = "var(--warning)"; }
                else if (data.status === 'stopped') { statusText = "SEQUENCE ABORTED BY USER."; color = "var(--error)"; }
                else if (data.status === 'completed') { statusText = "TARGET ACQUISITION COMPLETE."; color = "var(--success)"; }
                else if (data.status === 'error') { statusText = "CRITICAL SYSTEM FAILURE."; color = "var(--error)"; }

                const statEl = document.getElementById('status');
                statEl.innerText = statusText;
                statEl.style.color = color;

                if (['completed', 'error', 'stopped'].includes(data.status)) {
                    clearInterval(pollInterval);
                    resetState(true);
                }
            } catch (e) {
                console.error(e);
            }
        }

        function renderImages(images) {
            const container = document.getElementById('images-container');
            // Allow update if we have images and they haven't been rendered yet
            if (images.length > 0 && container.children.length !== images.length) {
                container.innerHTML = images.map(src => `
                    <div class="image-wrapper" onclick="triggerDeepSearch('${src}', this)">
                        <img src="${src}" class="captured-image" onerror="this.parentElement.style.display='none'">
                        <button class="btn-deep">DEEP SEARCH</button>
                    </div>
                `).join('');
            }
        }

        async function triggerDeepSearch(url, wrapper) {
            // Set Target Image in Modal
            document.getElementById('deep-target-img').src = url;

            // Show Scanner Overlay
            document.querySelector('.target-scan').style.display = 'block';

            // Open Modal
            const modal = document.getElementById('deepModal');
            modal.style.display = 'flex';
            document.getElementById('deep-status').innerHTML = "DEPLOYING MULTI-VECTOR VISUAL SEARCH PROTOCOLS...<br><span style='font-size:0.8rem; color:#888'>TARGET: [ GOOGLE ] + [ BING ] + [ YANDEX ] + [ TINEYE ]</span>";

            document.getElementById('google-results').innerHTML = '<div style="color:#00ff41; animation: blink 1s infinite;">[ ESTABLISHING UPLINK... ]</div>';
            document.getElementById('bing-results').innerHTML = '<div style="color:#00ff41; animation: blink 1s infinite;">[ ESTABLISHING UPLINK... ]</div>';
            document.getElementById('yandex-results').innerHTML = '<div style="color:#00ff41; animation: blink 1s infinite;">[ ESTABLISHING UPLINK... ]</div>';
            document.getElementById('tineye-results').innerHTML = '<div style="color:#00ff41; animation: blink 1s infinite;">[ ESTABLISHING UPLINK... ]</div>';

            try {
                const res = await fetch('/api/deep-search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image_url: url })
                });
                const data = await res.json();

                // Stop Scanner Overlay to indicate completion
                document.querySelector('.target-scan').style.display = 'none';

                document.getElementById('deep-status').innerText = "TARGET VISUAL MATCHES ACQUIRED.";

                renderDeepResults('google-results', data.google);
                renderDeepResults('bing-results', data.bing);
                renderDeepResults('yandex-results', data.yandex);
                renderDeepResults('tineye-results', data.tineye);

            } catch (e) {
                console.error(e);
                document.getElementById('deep-status').innerText = "VISUAL SEARCH FAILURE: CONNECTION LOST.";
                document.querySelector('.target-scan').style.display = 'none';
            }
        }

        function renderDeepResults(divId, images) {
            const container = document.getElementById(divId);
            if (!images || images.length === 0) {
                container.innerHTML = '<div style="color:#444">NO MATCHES FOUND</div>';
                return;
            }
            container.innerHTML = images.map(src => `<img src="${src}" class="deep-img" onclick="window.open('${src}')">`).join('');
        }

        function closeDeepModal() {
            document.getElementById('deepModal').style.display = 'none';
        }

        function renderResults(results) {
            const container = document.getElementById('results');
            // Sort: Verified first
            const sorted = [...results].sort((a, b) => {
                const rank = s => {
                    if (s === 'Verified') return 0;
                    if (s === 'Checking...') return 1;
                    if (s === 'Pending') return 2;
                    return 3;
                }
                return rank(a.validation) - rank(b.validation);
            });

            container.innerHTML = sorted.map(r => `
                <div class="result-card">
                    <div class="result-header">
                        <span class="site-name">${r.site}</span>
                        ${renderBadge(r)}
                    </div>
                    <a href="${r.url}" target="_blank" class="link">${r.url}</a>
                    ${r.page_title ? `<div class="meta-info">TITLE: ${r.page_title}</div>` : ''}
                    ${r.reason ? `<div class="meta-info" style="color:var(--error)">ERR: ${r.reason}</div>` : ''}
                </div>
            `).join('');
        }

        function renderBadge(res) {
            if (res.validation === 'Pending') return '<span class="status-badge">PENDING</span>';
            if (res.validation === 'Checking...') return '<span class="status-badge check">CHECKING</span>';
            if (res.validation === 'Verified') return '<span class="status-badge verified">VERIFIED</span>';
            if (res.validation === 'False Positive') return '<span class="status-badge false">FALSE+</span>';
            return '';
        }

        function resetState(finished = false) {
            document.getElementById('btn-scan').disabled = false;
            document.getElementById('btn-stop').disabled = true;
            document.getElementById('btn-download').disabled = !finished;
            document.getElementById('username').disabled = false;
        }
    </script>
</body>

</html>
